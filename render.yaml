# Render Blueprint for the Runlete FastAPI backend.
# Create the service: Render dashboard → New → Blueprint → connect this repo.
# Values marked `sync: false` are NOT in git — you enter them in the dashboard.
services:
  - type: web
    name: runlete-api
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements-runtime.txt"
    startCommand: "uvicorn backend.server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DB_NAME
        value: runlete
      # Workouts + embeddings stay off — the running/club app doesn't need them,
      # and it keeps the free instance light and the build fast.
      - key: WORKOUT_GENERATION_ENABLED
        value: "false"
      - key: EXERCISE_EMBEDDINGS_ENABLED
        value: "false"
      # Email (OTP) — non-secret parts only; the password is a secret below.
      - key: SMTP_HOST
        value: "smtp.hostinger.com"
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_FROM_NAME
        value: "Runlete"
      # ── Secrets / environment-specific — enter these in the Render dashboard ──
      - key: MONGO_URL          # MongoDB Atlas connection string (mongodb+srv://…)
        sync: false
      - key: JWT_SECRET         # a long random string (keep it stable, never share)
        sync: false
      - key: INFO_EMAIL_USER    # info@ydhya.in
        sync: false
      - key: INFO_EMAIL_PASS    # the Hostinger mailbox password
        sync: false
      - key: ALLOWED_ORIGINS    # e.g. https://runlete-api.onrender.com (see DEPLOY.md)
        sync: false
