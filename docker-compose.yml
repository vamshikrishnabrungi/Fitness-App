services:
  postgis:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: runlete
      POSTGRES_USER: runlete
      POSTGRES_PASSWORD: runlete
    ports:
      - "5432:5432"
    volumes:
      - runlete-postgis:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runlete -d runlete"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - runlete-redis:/data

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=runlete-local
    ports:
      - "8085:8085"

  storage:
    image: fsouza/fake-gcs-server:1.52
    command: -scheme http -port 4443 -external-url http://localhost:4443
    ports:
      - "4443:4443"
    volumes:
      - runlete-gcs:/storage

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: alembic -c alembic.ini upgrade head
    environment: &app-env
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://runlete:runlete@postgis:5432/runlete
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: development-only-change-me-development-only
      OTP_PEPPER: development-only-otp-pepper-change-me
      PUBSUB_EMULATOR_HOST: pubsub:8085
      STORAGE_EMULATOR_HOST: http://storage:4443
      RAW_ACTIVITY_BUCKET: runlete-raw-local
      IMPORT_BUCKET: runlete-imports-local
      NUTRITION_IMAGE_BUCKET: runlete-food-local
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_WORKOUT_MODEL: ${OPENAI_WORKOUT_MODEL:-gpt-4o}
      OPENAI_FOOD_MODEL: ${OPENAI_FOOD_MODEL:-gpt-4o}
      TRAINING_GENERATION_ENABLED: ${TRAINING_GENERATION_ENABLED:-false}
    depends_on:
      postgis: { condition: service_healthy }

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *app-env
    ports: ["8000:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
      pubsub: { condition: service_started }
      storage: { condition: service_started }

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:3.5.1
    profiles: ["geo"]
    restart: unless-stopped
    environment:
      tile_urls: ${VALHALLA_TILE_URLS:-https://download.geofabrik.de/asia/india/southern-zone-latest.osm.pbf}
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      serve_tiles: "True"
    ports:
      - "8002:8002"
    volumes:
      - runlete-valhalla:/custom_files

volumes:
  runlete-postgis:
  runlete-redis:
  runlete-valhalla:
  runlete-gcs:
