name: Runlete validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: runlete
          POSTGRES_USER: runlete
          POSTGRES_PASSWORD: runlete
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runlete -d runlete"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      JWT_SECRET: ci-only-jwt-secret-ci-only-jwt-secret
      OTP_PEPPER: ci-only-otp-pepper-ci-only-otp-pepper
      DATABASE_URL: postgresql+asyncpg://runlete:runlete@127.0.0.1:5432/runlete
      PGPASSWORD: runlete
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements-runtime.txt pytest pglast
      - name: Migrate clean database
        run: alembic -c alembic.ini upgrade head
      - run: python -m pytest -q tests/production
      - name: Reject removed runtime dependencies and routes
        run: |
          ! rg -n 'motor|pymongo|celery|MONGO_URL|boto3|S3_' backend/app backend/requirements-runtime.txt
          ! rg -n '/api/terra|/api/workouts|/api/meals|/api/health|/api/lessons' frontend --glob '!node_modules/**'

  mobile:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-jwt-secret
      EXPO_PUBLIC_BACKEND_URL: http://127.0.0.1:8000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: pip install -r backend/requirements-runtime.txt
      - run: corepack enable && yarn install --frozen-lockfile
        working-directory: frontend
      - name: Regenerate API contract
        run: |
          python - <<'PY'
          import json
          from backend.app.main import app
          with open("openapi.json", "w") as output:
              json.dump(app.openapi(), output, indent=2)
              output.write("\n")
          PY
          cd frontend
          yarn generate:api
      - run: yarn typecheck
        working-directory: frontend
      - run: yarn lint
        working-directory: frontend
      - run: npx expo export --platform web --output-dir dist-web-validation
        working-directory: frontend
      - name: Ensure generated contracts are committed
        run: git diff --exit-code -- openapi.json frontend/src/api/generated.ts

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: npm run build
        working-directory: admin
